  interpretation: Trifecta/Trifecta GT's own raw event rate (5.6%/14.3%) is NOT higher
    than Biocor (100%, n=2) or Magna (33%, n=3) in this cohort's raw numbers, which
    on its face does not reproduce the literature's Trifecta early-SVD signal. But
    Trifecta/Trifecta GT patients have a much shorter mean observed follow-up (~3.5y)
    than Biocor/Magna (7-14.5y) in this cohort -- consistent with Trifecta being a
    newer device with less elapsed implant-to-now time in this specific snapshot,
    not necessarily lower true risk. Combined with the clean 'no SVD before 5 years'
    finding below (all 11 events occurred at 5-15 years post-implant), most of this
    cohort's Trifecta patients (mean follow-up 3.5y) have not yet reached the window
    where SVD would typically appear. This is a CONFOUNDED comparison, not a clean
    replication or refutation -- reported as such, not smoothed into either direction.
