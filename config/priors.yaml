generated_by: src/models/durability/fit_literature_priors.py
method: Least-squares fit of log(-log S(t)) vs log(t) (Master Prompt Section 6.2); single-point families
  borrow shape k from their approach-level population fit.
weibull_parameterization: S(t) = exp(-(t/scale_lambda_years)^shape_k), t in years since index implant
cv_note: Default CV 40% for multi-point fits (Section 6.2 default where published CIs are absent); 64%
  for single-point families (shape borrowed, only one observed point).
trifecta_note: 'No Trifecta-specific durability point found in any of the 3 provided source PDFs (full-text
  search, 2026-09-17: zero matches for ''Trifecta'' in ehaa799.pdf, ejcts_52_3_408.pdf, JAH3-14-e041505.pdf).
  Trifecta valves in this cohort account for 3 of 8 seed-table SVD-signal patients (Patient_017, 030,
  058 — see review/error_catalogue.md), a known clinical early-SVD signal, but it is NOT encoded numerically
  here — Trifecta is assigned the savr_general_population prior only, with this note attached so a physician
  can manually flag Trifecta patients for closer surveillance pending a sourced Trifecta-specific durability
  estimate. TODO: source required.'
